<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Chamado - TechHelp TI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container nav-container">
            <h1>TechHelp TI</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="chamado.html" class="ativo">Abrir Chamado</a></li>
                    <li><a href="faq.html">Dúvidas (FAQ)</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Abrir Novo Chamado Técnico</h2>
            <p>Preencha os dados abaixo para que um técnico atenda sua solicitação.</p>

            <form id="formChamado">
                <div class="campo">
                    <label for="nome">Seu Nome:</label>
                    <input type="text" id="nome" placeholder="Ex: João Silva">
                </div>

                <div class="campo">
                    <label for="setor">Setor / Departamento:</label>
                    <input type="text" id="setor" placeholder="Ex: Financeiro, RH, Vendas">
                </div>

                <div class="campo">
                    <label for="urgencia">Nível de Urgência:</label>
                    <select id="urgencia">
                        <option value="">Selecione...</option>
                        <option value="Baixa">Baixa (Dúvida ou solicitação simples)</option>
                        <option value="Média">Média (Sistema lento, mas consigo trabalhar)</option>
                        <option value="Alta">Alta (Computador ou sistema parado)</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição do Problema:</label>
                    <textarea id="descricao" rows="4" placeholder="Explique o que está acontecendo..."></textarea>
                </div>

                <button type="submit" class="btn">Enviar Chamado</button>
            </form>

            <!-- Área onde o JS vai mostrar o resultado -->
            <div id="mensagemRetorno" class="mensagem oculto"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TechHelp Suporte de TI - Trabalho Final</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
